name: Bug
description: Reproducible defect in backend, mobile, admin, docs, or tooling
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error code/envelope, logs, or a screenshot. Remove tokens and personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: branch or commit SHA
  - type: textarea
    id: test
    attributes:
      label: Regression test
      description: What test will fail before the fix and pass after it?
    validations:
      required: true

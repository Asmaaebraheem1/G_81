name: Mobile CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze, test, coverage and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests with coverage
        run: flutter test --coverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce 50% line-coverage gate
        run: python ../scripts/check_lcov.py coverage/lcov.info --min 50

      - name: Debug APK build
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:5001/api/v1
